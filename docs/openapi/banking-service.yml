openapi: 3.1.0
info:
  title: Casino-Mansion Banking Service API
  version: 0.0.1
  description: >
    API-Basis des Banking-Services. Es sind noch keine REST-Controller implementiert.
    Die Datei wird bei der Implementierung um konkrete Pfade erweitert.
servers:
  - url: http://localhost:8080/casino/bank/api
    description: Lokale Docker-Compose-Umgebung
tags:
  - name: Users
    description: Geplanter Bereich für Nutzerverwaltung
  - name: Transactions
    description: Geplanter Bereich für Geldtransaktionen
paths: {}
components:
  schemas:
    User:
      type: object
      description: JPA-Datenmodell; noch nicht über einen REST-Endpunkt bereitgestellt.
      required:
        - firstName
        - lastName
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Von der Datenbank generierte ID.
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50
    Problem:
      type: object
      description: Empfohlenes Fehlerformat; noch nicht durch einen Exception-Handler implementiert.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
